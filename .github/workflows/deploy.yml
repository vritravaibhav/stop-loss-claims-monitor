# Manual production deploy. Never runs on push. Prerequisites (infra/terraform/README.md):
# infrastructure applied, repository variables set from `terraform output
# github_actions_variables`, app/config/prod.json committed, and a "production" environment
# (add required reviewers there).
#
# Order: build + push image -> migrate (Cloud Run Job, waits) -> roll out API -> build and
# deploy the web app. Migrations run before new code serves traffic, so they must be
# backwards compatible with the revision that is still live (expand/contract).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run the stoploss-migrate Cloud Run Job before rolling out the API
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # GitHub OIDC token, exchanged for GCP credentials via Workload Identity Federation

# Never two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORY: stoploss
  SERVICE: stoploss-api
  MIGRATE_JOB: stoploss-migrate
  HOSTING_URL: ${{ vars.FIREBASE_HOSTING_URL || format('https://{0}.web.app', vars.GCP_PROJECT_ID) }}
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.47.4"
  FIREBASE_TOOLS_VERSION: "15.34.2"

jobs:
  deploy:
    name: Deploy API (Cloud Run) and web (Firebase Hosting)
    # The WIF provider only trusts refs/heads/main as well; this fails fast with a clear reason.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Repository variable GCP_PROJECT_ID is not set"; exit 1
          fi
          if [ ! -f app/config/prod.json ]; then
            echo "::error::app/config/prod.json is missing (terraform output -json app_prod_config)"; exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          # Writes an external-account credentials file and exports
          # GOOGLE_APPLICATION_CREDENTIALS; gcloud and firebase-tools both use it.

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Image name
        run: echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push API image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          # Tags are immutable in Artifact Registry, so re-running a deploy for the same
          # commit (e.g. to roll back) reuses the existing image.
          if gcloud artifacts docker images describe "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists, reusing it"
          else
            docker build --platform linux/amd64 -t "$IMAGE" api
            docker push "$IMAGE"
          fi

      - name: Run database migrations
        if: inputs.run_migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$IMAGE" \
            --region "$REGION" --project "$PROJECT_ID" --quiet
          gcloud run jobs execute "$MIGRATE_JOB" \
            --region "$REGION" --project "$PROJECT_ID" --wait

      - name: Deploy API to Cloud Run
        run: |
          # Only the image changes; the rest of the service config is owned by Terraform.
          gcloud run deploy "$SERVICE" --image "$IMAGE" \
            --region "$REGION" --project "$PROJECT_ID" --quiet
          url=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 3 "$url/healthz"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build web app (production config)
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --dart-define-from-file=config/prod.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to Firebase Hosting
        # firebase.json: public app/build/web, /api/** and /healthz rewritten to stoploss-api.
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy --only hosting \
            --project "$PROJECT_ID" --non-interactive

      - name: Smoke test through Hosting
        run: |
          curl -fsS --retry 5 --retry-delay 5 "$HOSTING_URL/healthz"
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 "$HOSTING_URL/"
