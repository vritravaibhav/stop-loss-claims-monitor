name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in CI writes to the repo or talks to the cloud.
permissions:
  contents: read

# One run per PR / branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.47.4"
  TERRAFORM_VERSION: "1.17.1"

jobs:
  api:
    name: API (build, migrate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stoploss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stoploss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stoploss_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
      # Migrations must apply cleanly to an empty database (same command as the prod job).
      - run: npm run migrate
      - run: npm test

  app:
    name: App (analyze, test, build web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true # SDK + pub cache (keyed on pubspec.lock)
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Default dart-defines = local emulator config; this only proves the web build compiles.
      - run: flutter build web --release

  docker:
    name: Docker compose end-to-end
    needs: [api, app]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: docker compose build
      - name: Start stack (waits for every healthcheck)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test
        run: |
          check() {
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "$1"; then echo "ok $1"; return 0; fi
              sleep 2
            done
            echo "::error::$1 did not answer"; return 1
          }
          check http://localhost:8080/healthz   # api directly
          check http://localhost:8081/          # Flutter build via nginx
          check http://localhost:8081/healthz   # nginx -> api proxy
          check http://localhost:9099/          # auth emulator, as the browser sees it
      # Signs in through the emulator, uploads every sample file and compares counts,
      # failed rows, alerts and spend with tools/reference_model.py, then checks broker
      # isolation. Goes through nginx (:8081) so the /api proxy and upload size limit are
      # exercised too. Needs a fresh database, which this job always has.
      - name: End-to-end check
        env:
          API_URL: http://localhost:8081
          AUTH_EMULATOR_URL: http://localhost:9099
        run: python3 tools/e2e_check.py
      - name: Service logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
      - name: Tear down
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/.terraform.lock.hcl') }}
      - run: terraform fmt -check -recursive
      # No backend, no credentials: validate only checks the configuration against the
      # provider schemas. No plan or apply in CI.
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
