# docker compose "web" service: serves the Flutter web build and proxies the API, so the
# browser talks to one origin (no CORS). In prod, Firebase Hosting rewrites do the same job
# (see firebase.json).

# Docker's embedded DNS. Using a variable in proxy_pass makes nginx resolve "api" per request
# (cached for 10s) instead of once at startup: nginx starts even if the api container isn't
# up yet, and follows it when compose recreates it with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative redirects: the container listens on 80 but is published on 8081.
    absolute_redirect off;

    # Claim files are uploaded through /api/uploads.
    client_max_body_size 50m;

    # Inherited by every location below as long as they don't declare add_header themselves
    # (nginx drops inherited add_header directives in that case).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    set $api_upstream http://api:8080;

    # The API's routes include the /api prefix, so pass the URI through unchanged
    # (proxy_pass with a variable and no URI part forwards the original request URI).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Large uploads are parsed and applied in one transaction before the response.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Only nginx's own errors (API unreachable / timed out) are rewritten; API responses
        # pass through untouched because proxy_intercept_errors is off.
        error_page 502 503 504 = @api_unavailable;
    }

    location = /healthz {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"API unavailable"}';
    }

    # SPA: unknown paths fall back to index.html so deep links work. Flutter's build output
    # isn't content-hashed (main.dart.js, flutter_bootstrap.js), so make browsers revalidate
    # (ETag -> 304) rather than run a stale build. "expires" is used instead of add_header so
    # the security headers above are still inherited.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
