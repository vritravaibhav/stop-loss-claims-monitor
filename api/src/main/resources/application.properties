spring.application.name=stoploss-api
spring.main.banner-mode=off

# HTTP
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.web.error.whitelabel.enabled=false
# Content-Type: application/json;charset=UTF-8 (clients that honour the charset, e.g. Dart's http, decode correctly)
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
# Unknown paths are 404 {"error":"Not found"} from the API, not static resources.
spring.web.resources.add-mappings=false

# Uploads: one claim file of at most 25 MB in field "file", kept in memory; parsed only when the controller asks
# (after the analyst check).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.file-size-threshold=26MB
spring.servlet.multipart.resolve-lazily=true

# Database: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD. Flyway (db/migration) runs at startup unless
# SPRING_FLYWAY_ENABLED=false; --app.mode=migrate always migrates.
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.locations=classpath:db/migration

